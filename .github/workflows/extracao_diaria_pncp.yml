name: Extração Diária PNCP - Câmara de Piracicaba

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  # O comando abaixo habilita um botão para você rodar a automação manualmente quando quiser
  workflow_dispatch: 

jobs:
  auditoria-diaria:
    runs-on: ubuntu-latest

    # Concede permissão de escrita para que o bot possa salvar o CSV no repositório
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Executar Script de Extração
        run: python auditoria_camara_piracicaba.py

      - name: Salvar CSV no Repositório (Commit Automático)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática: Base de contratos PNCP"
          file_pattern: "*.csv"
